  <rect x="218" y="202" width="64" height="36" rx="18" ry="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="250" y="225" text-anchor="middle" font-family="Arial" font-size="14">{2}</text>
  <rect x="358" y="202" width="64" height="36" rx="18" ry="18" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="390" y="225" text-anchor="middle" font-family="Arial" font-size="14">{3}</text>
  <!-- Level 2 -->
