<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="#fff"/>
  <!-- Edges (Hasse diagram: smaller at bottom, larger at top) -->
  <line x1="210" y1="330" x2="140" y2="260" stroke="#000" stroke-width="1.5"/>
  <line x1="210" y1="330" x2="280" y2="260" stroke="#000" stroke-width="1.5"/>
  <line x1="140" y1="260" x2="210" y2="190" stroke="#000" stroke-width="1.5"/>
  <line x1="280" y1="260" x2="210" y2="190" stroke="#000" stroke-width="1.5"/>
  <line x1="280" y1="260" x2="350" y2="190" stroke="#000" stroke-width="1.5"/>
  <line x1="210" y1="190" x2="280" y2="120" stroke="#000" stroke-width="1.5"/>
  <line x1="350" y1="190" x2="280" y2="120" stroke="#000" stroke-width="1.5"/>
  <line x1="350" y1="190" x2="420" y2="120" stroke="#000" stroke-width="1.5"/>
  <line x1="280" y1="120" x2="210" y2="50" stroke="#000" stroke-width="1.5"/>
  <!-- Level 0 -->
  <circle cx="210" cy="330" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="210" y="335" text-anchor="middle" font-family="Arial" font-size="14">1</text>
  <!-- Level 1 -->
  <circle cx="140" cy="260" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="140" y="265" text-anchor="middle" font-family="Arial" font-size="14">2</text>
  <circle cx="280" cy="260" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="280" y="265" text-anchor="middle" font-family="Arial" font-size="14">5</text>
  <!-- Level 2 -->
  <circle cx="210" cy="190" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="210" y="195" text-anchor="middle" font-family="Arial" font-size="14">10</text>
  <circle cx="350" cy="190" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="350" y="195" text-anchor="middle" font-family="Arial" font-size="14">25</text>
  <!-- Level 3 -->
  <circle cx="280" cy="120" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="280" y="125" text-anchor="middle" font-family="Arial" font-size="14">50</text>
  <circle cx="420" cy="120" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="420" y="125" text-anchor="middle" font-family="Arial" font-size="14">125</text>
  <!-- Level 4 -->
  <circle cx="210" cy="50" r="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="210" y="55" text-anchor="middle" font-family="Arial" font-size="14">100</text>
</svg>
